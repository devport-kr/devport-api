name: CI & Image Build

on:
  pull_request:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

# PRs cancel superseded runs for fast feedback; pushes/tags let an in-flight
# image build+push finish (cancel-in-progress only for pull_request events).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Verify — compiles all 34 modules, runs ktlint, the unit tests, and the
  # Konsist ArchitectureBoundaryTest (the strict-hexagonal boundary guard), then
  # assembles the bootJar. `-PexcludeIntegrationTests` drops the Testcontainers
  # boot test (@Tag("integration")) so no pgvector/Redis is needed here.
  # Runs on every trigger and gates the image build below.
  # ---------------------------------------------------------------------------
  verify:
    name: Build, lint & architecture boundary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (dependency + build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, lint & verify architecture boundaries
        run: ./gradlew build -PexcludeIntegrationTests --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build & push the JVM image — only after `verify` is green, and never on a
  # pull_request (no image is published from a PR). Fires on push to `dev`,
  # `v*` tags, and manual dispatch.
  # ---------------------------------------------------------------------------
  build-jvm-image:
    name: Build & push JVM image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (dependency + build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-jvm,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push JVM image with Cloud Native Buildpacks
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(echo "$TAGS" | head -n 1)

          # bootBuildImage is JVM-only now (GraalVM/native was removed in the hex refactor).
          # Builder, buildpacks, and BP_JVM_VERSION are configured in
          # application-api/build.gradle.kts — nothing to pass here but the image name.
          ./gradlew :application-api:bootBuildImage \
            --imageName="$FIRST_TAG" \
            --no-daemon

          # Push the built image, then fan out the remaining metadata-action tags.
          docker push "$FIRST_TAG"
          for tag in $TAGS; do
            if [ "$tag" != "$FIRST_TAG" ]; then
              docker tag "$FIRST_TAG" "$tag"
              docker push "$tag"
            fi
          done
        env:
          GRADLE_OPTS: -Xmx6g
